[package]
name = "ujiin-guru"
version = "0.1.0"
edition = "2021"
description = "Aplikasi desktop (Windows & Linux) untuk guru & admin Ujiin (CBT)"

[dependencies]
calamine = { version = "0.38.0", default-features = false }
dirs = "7.0.0"
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
open = "5.4.5"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ureq = { version = "3.5.2", features = ["json", "cookies"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target."cfg(windows)".dependencies]
rfd = { version = "0.18.0", default-features = false }
winrt-notification = "0.5.1"

[target."cfg(target_os = \"linux\")".dependencies]
rfd = { version = "0.18.0", default-features = false, features = ["xdg-portal", "wayland"] }
notify-rust = { version = "4.11", default-features = false, features = ["z"] }
