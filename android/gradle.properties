org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# ====== PENGATURAN APLIKASI ======
# URL website Ujiin yang sudah online (WAJIB https). Bisa ditimpa saat build:
#   gradle assembleRelease -PujiinUrl=https://ujian.sekolahku.sch.id
ujiinUrl=https://GANTI-DENGAN-URL-UJIIN-ANDA
# Nama yang tampil di layar HP
ujiinAppName=Ujiin
# true  = ujian DIBLOKIR jika USB debugging aktif atau HP di-root
# false = hanya website yang tidak memeriksa (tidak disarankan)
ujiinStrictDeviceCheck=true
