<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tidak ada koneksi</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       font-family:system-ui,sans-serif;background:#f9fafb;color:#111827;text-align:center;padding:24px;box-sizing:border-box}
  .card{max-width:360px;background:#fff;border-radius:24px;padding:32px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
  h1{font-size:20px;margin:0 0 8px}
  p{color:#6b7280;font-size:14px;line-height:1.5;margin:0 0 24px}
  button{width:100%;padding:14px;border:0;border-radius:14px;background:#0d9488;color:#fff;font-size:16px;font-weight:700}
</style>
</head>
<body>
  <div class="card">
    <h1>Tidak bisa terhubung</h1>
    <p>Pastikan HP terhubung ke WiFi atau data seluler, lalu coba lagi. Jawaban ujian yang sudah dikerjakan tetap aman.</p>
    <button onclick="if(window.UjiinNative){UjiinNative.retry()}else{history.back()}">Coba Lagi</button>
  </div>
</body>
</html>
